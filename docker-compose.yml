services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      - POSTGRES_DB=copilot
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30


  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    ports:
      - 127.0.0.1:16686:16686 # Jaeger UI
      - 127.0.0.1:4318:4318 # OTLP HTTP collector


volumes:
  db_data:
